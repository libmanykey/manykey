[package]
name = "manykey-view"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tiled on-screen keyboards that light up per physical keyboard, built on manykey"
publish = false

[dependencies]
manykey = { path = "../.." }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
