name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to full commit SHAs (the comment is the tag they correspond
# to). Dependabot proposes updates; review them like any other dependency.
jobs:
  # The library builds and its tests pass on every platform we mention.
  # (macOS has no backend yet; this just keeps the crate compiling there.)
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Library, command line tool and doctests
        run: cargo test -p manykey
      - name: Viewer app (Windows and Linux, where it has been run)
        if: runner.os != 'macOS'
        run: cargo test -p manykey-view

  # The committed C header must match what cbindgen generates, and C code must compile against it.
  header:
    name: C header is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cbindgen@0.29.4
      - name: Regenerate the header
        run: cbindgen --config cbindgen.toml --crate manykey --output include/manykey.h
      - name: Fail if it differs from the committed one
        run: git diff --exit-code include/manykey.h
      - name: C example compiles against the header
        run: gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only -Iinclude examples/watch.c

  # Formatting (see rustfmt.toml) and lints, with warnings treated as errors.
  # The library denies missing docs, so undocumented public items fail here.
  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p manykey --all-targets -- -D warnings

  # Runs the real Windows binary and checks that injected key presses come out
  # of the Raw Input backend.
  windows-smoke:
    name: windows backend smoke test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build -p manykey
      - run: pwsh -NoProfile -File ci/windows-smoke.ps1

  # Creates virtual keyboards with uinput and drives the Linux (evdev) backend
  # with them: key events, hot-plug, unplug-while-held, and the permission error
  # an unprivileged user gets. The closest thing to hardware testing we can do in CI.
  linux-uinput:
    name: linux backend vs virtual keyboards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build -p manykey
      - run: sudo modprobe uinput || true
      - run: ls -l /dev/uinput
      - run: sudo python3 ci/linux-uinput-smoke.py target/debug/manykey

  # The Godot extension (bindings/godot). Compiling gdext is slow the first time and cached afterwards.
  godot-extension:
    name: godot extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build -p manykey-godot
      - run: cargo test -p manykey-godot
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy -p manykey-godot --all-targets -- -D warnings

  # Loads the Godot extension into a real headless Godot and types on virtual
  # keyboards (uinput), on the oldest Godot it claims to support and a current one.
  godot-linux:
    name: godot extension vs virtual keyboards (Godot ${{ matrix.godot.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        godot:
          # Official builds, checked against the SHA-512 from each release's SHA512-SUMS.txt.
          - version: 4.3-stable
            sha512: fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a
          - version: 4.7.2-stable
            sha512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: bash bindings/godot/build.sh
      - name: Download Godot ${{ matrix.godot.version }}
        run: |
          zip="Godot_v${{ matrix.godot.version }}_linux.x86_64.zip"
          curl -sSLo "$RUNNER_TEMP/$zip" "https://github.com/godotengine/godot/releases/download/${{ matrix.godot.version }}/$zip"
          echo "${{ matrix.godot.sha512 }}  $RUNNER_TEMP/$zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${{ matrix.godot.version }}_linux.x86_64" >> "$GITHUB_ENV"
      - run: sudo modprobe uinput || true
      - run: sudo python3 ci/linux-godot-smoke.py "$GODOT" bindings/godot/demo
